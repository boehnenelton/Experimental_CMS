<!-- Component: News Feed Item | v1.0 -->
<div class="news-item">
    <div class="news-thumb">
        {% if featured_img %}<img src="{{ img_url }}">{% else %}<span>IMG</span>{% endif %}
    </div>
    <div class="news-content">
        <div class="news-category">{{ category_name }}</div>
        <h2 class="news-title"><a href="{{ slug }}/index.html">{{ title }}</a></h2>
        <p class="news-excerpt">{{ excerpt }}</p>
        <div class="news-meta"><span>{{ created_at }}</span></div>
    </div>
</div>
