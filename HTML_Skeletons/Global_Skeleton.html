<!-- ExpCSS | Universal Site Skeleton v3.0 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | {{ site_title }}</title>

    <style>
        /* ── Design Tokens ───────────────────────────────── */
        :root {
            --primary:      #DE2626;
            --primary-dark: #b81e1e;
            --bg:           #050505;
            --surface:      #0f0f0f;
            --surface-2:    #161616;
            --border:       #222;
            --text:         #e8e8e8;
            --text-muted:   #666;
            --font-sans:    'Inter', system-ui, -apple-system, sans-serif;
            --font-mono:    'Source Code Pro', 'Courier New', monospace;
            --radius:       6px;
            --sidebar-w:    280px;
            --header-h:     56px;

            /* Aliases so shared admin components embedded in page content
               (e.g. the BEJSON table/combobox viewer) resolve to real colors
               here instead of falling back to unstyled defaults. */
            --bg-page:      var(--surface);
            --bg-alt:       var(--surface-2);
            --text-main:    var(--text);
        }

        /* ── Reset ───────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── Header ──────────────────────────────────────── */
        .site-header {
            height: var(--header-h);
            background: #000;
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 200;
            flex-shrink: 0;
        }
        .site-header__logo {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #fff;
        }
        .site-header__logo span { color: var(--primary); }
        .site-header__spacer { flex: 1; }
        .site-header__meta {
            font-size: 0.55rem;
            font-family: var(--font-mono);
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* ── Hamburger ───────────────────────────────────── */
        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
            background: none;
            border: none;
            flex-shrink: 0;
        }
        .hamburger span {
            display: block;
            width: 18px;
            height: 2px;
            background: #fff;
            border-radius: 1px;
            transition: 0.2s;
        }
        @media (min-width: 1025px) { .hamburger { display: none; } }

        /* ── App Shell ───────────────────────────────────── */
        .app-shell {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ── Sidebar ─────────────────────────────────────── */
        .app-sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: width 0.25s ease, opacity 0.25s ease;
        }
        .app-sidebar.collapsed {
            width: 0;
            opacity: 0;
            overflow: hidden;
        }
        .app-sidebar__header {
            padding: 0.75rem 1rem;
            background: #000;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            font-weight: 700;
        }
        .app-sidebar__nav { padding: 0.5rem; flex: 1; }
        .app-sidebar__nav ul { list-style: none; }
        .app-sidebar__nav li a {
            display: block;
            padding: 8px 12px;
            border-radius: var(--radius);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.15s, color 0.15s;
        }
        .app-sidebar__nav li a:hover {
            background: rgba(222,38,38,0.08);
            color: var(--text);
        }
        .c-sidebar__links { width: 100%; }

        /* Mobile sidebar overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 150;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; }

        @media (max-width: 1024px) {
            .app-sidebar {
                position: fixed;
                top: var(--header-h);
                left: 0;
                height: calc(100dvh - var(--header-h));
                z-index: 160;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                width: var(--sidebar-w);
                opacity: 1;
            }
            .app-sidebar.mobile-open { transform: translateX(0); }
            .app-sidebar.collapsed { width: var(--sidebar-w); opacity: 1; transform: translateX(-100%); }
        }

        /* ── Main Content ────────────────────────────────── */
        .app-main {
            flex: 1;
            overflow-y: auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .app-main__inner {
            flex: 1;
            padding: 1.5rem;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
        }

        /* ── Breadcrumb ──────────────────────────────────── */
        .breadcrumb {
            font-size: 0.65rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .breadcrumb span { color: var(--primary); font-weight: 700; }

        /* ── Typography ──────────────────────────────────── */
        h1, h2, h3 { font-weight: 800; line-height: 1.2; color: #fff; }
        h1 { font-size: clamp(1.5rem, 4vw, 2.25rem); margin-bottom: 1rem; }
        h2 { font-size: 1.25rem; margin: 1.5rem 0 0.5rem; }
        p { margin-bottom: 1rem; }
        a { color: var(--primary); }
        a:hover { color: var(--primary-dark); }
        ul, ol { padding-left: 1.25rem; margin-bottom: 1rem; }
        li { margin-bottom: 0.25rem; }
        code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
        }
        blockquote {
            border-left: 3px solid var(--primary);
            padding: 0.75rem 1rem;
            background: var(--surface-2);
            margin: 1rem 0;
            font-style: italic;
        }

        /* ── Content Feed Cards ──────────────────────────── */
        .feed-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.5rem;
        }
        .feed-desc { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .feed-grid { display: flex; flex-direction: column; gap: 1rem; }

        /* Blog cards */
        .blog-card {
            display: flex; gap: 1rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1rem;
            transition: border-color 0.2s;
            text-decoration: none; color: inherit;
        }
        .blog-card:hover { border-color: var(--primary); }
        .blog-thumb {
            width: 100px; flex-shrink: 0;
            aspect-ratio: 16/9;
            background: var(--surface-2);
            border-radius: 4px;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; color: var(--text-muted);
        }
        .blog-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .blog-card-body { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
        .blog-card-title { font-weight: 700; font-size: 1rem; color: #fff; }
        .blog-card-title a { color: inherit; text-decoration: none; }
        .blog-card-title a:hover { color: var(--primary); }
        .blog-card-excerpt { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
        .blog-card-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: auto; font-family: var(--font-mono); }

        /* News items */
        .news-item {
            display: grid; grid-template-columns: 120px 1fr; gap: 1rem;
            padding: 1rem 0; border-bottom: 1px solid var(--border);
        }
        .news-thumb {
            aspect-ratio: 16/9; background: var(--surface-2); border-radius: 4px;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; color: var(--text-muted);
        }
        .news-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .news-content { display: flex; flex-direction: column; gap: 4px; }
        .news-category { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); font-family: var(--font-mono); }
        .news-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .news-title a { color: inherit; text-decoration: none; }
        .news-title a:hover { color: var(--primary); }
        .news-excerpt { font-size: 0.8rem; color: var(--text-muted); }
        .news-meta { font-size: 0.65rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: auto; }

        /* Product cards */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
        .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s; }
        .product-card:hover { border-color: var(--primary); }
        .product-img { aspect-ratio: 4/3; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: var(--text-muted); overflow: hidden; }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-details { padding: 0.75rem; }
        .product-title { font-weight: 700; font-size: 0.9rem; color: #fff; margin-bottom: 0.5rem; }
        .product-title a { color: inherit; text-decoration: none; }
        .product-title a:hover { color: var(--primary); }
        .product-price-row { display: flex; justify-content: flex-end; margin-top: 0.5rem; }
        .product-add { background: var(--primary); color: #fff; border: none; padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 700; }

        /* Masonry */
        .masonry-grid { columns: 3; gap: 0.75rem; }
        @media (max-width: 768px) { .masonry-grid { columns: 2; } }
        @media (max-width: 480px) { .masonry-grid { columns: 1; } }
        .masonry-item {
            break-inside: avoid; margin-bottom: 0.75rem;
            position: relative; border-radius: var(--radius);
            overflow: hidden; background: var(--surface-2); cursor: pointer;
        }
        .masonry-item img { width: 100%; display: block; }
        .masonry-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; align-items: flex-end;
            opacity: 0; transition: opacity 0.2s;
        }
        .masonry-item:hover .masonry-overlay { opacity: 1; }
        .masonry-title { padding: 0.75rem; color: #fff; font-weight: 700; font-size: 0.85rem; width: 100%; }
        .masonry-title a { color: inherit; text-decoration: none; }

        /* ── Article / Page ──────────────────────────────── */
        .article-meta { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
        .article-body { max-width: 720px; }
        .article-body p { color: var(--text); line-height: 1.8; font-size: 0.975rem; }
        .pull-quote { border-left: 4px solid var(--primary); padding: 0.75rem 1.25rem; background: var(--surface-2); margin: 1.5rem 0; font-style: italic; font-size: 1.05rem; color: var(--text); }
        .tag { display: inline-block; padding: 2px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-mono); }

        /* ── Footer ──────────────────────────────────────── */
        .site-footer {
            background: #000;
            border-top: 1px solid var(--border);
            padding: 1.5rem;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-align: center;
        }
        .site-footer a { color: var(--primary); text-decoration: none; }
        .c-footer-links { padding: 2.5rem 1.5rem; border-top: 1px solid var(--border); margin-top: 2rem; }
        .c-footer-links .container { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 2rem; }
        .c-footer-links h4 { color: var(--primary); font-weight: 800; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; font-size: 0.7rem; }
        .c-footer-links p, .c-footer-links li { font-size: 0.85rem; color: var(--text-muted); line-height: 1.8; }
        .c-footer-links ul { list-style: none; padding: 0; }
        .c-footer-links a { color: var(--text-muted); text-decoration: none; }
        .c-footer-links a:hover { color: var(--primary); }

        /* ── Shared component styles (widgets embeddable in page content) ── */
        {{ shared_component_css | safe }}
    </style>
</head>
<body>
    <header class="site-header">
        <button class="hamburger" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <div class="site-header__logo">{{ site_title }}<span>.</span></div>
        <div class="site-header__spacer"></div>
        <div class="site-header__meta">EXPCMS v{{ expcms_version }}</div>
    </header>

    <div class="sidebar-overlay" id="overlay"></div>

    <div class="app-shell">
        <aside class="app-sidebar" id="sidebar">
            <div class="app-sidebar__header">Navigate</div>
            <div class="app-sidebar__nav">
                {{ sidebar_block | safe }}
            </div>
        </aside>

        <main class="app-main">
            <div class="app-main__inner">
                <div class="breadcrumb">
                    <a href="{{ rel_prefix }}index.html" style="color:inherit;text-decoration:none;">{{ site_title }}</a>
                    / <a href="{{ rel_prefix }}{{ category_slug or '' }}{% if category_slug %}/index.html{% endif %}" style="color:inherit;text-decoration:none;">{{ category_name or 'Home' }}</a>
                    / <span>{{ page_title }}</span>
                </div>

                {{ main_content | safe }}

                {% if related_content %}
                <section style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                    <h3 style="margin-bottom: 1rem;">More from {{ category_name }}</h3>
                    {{ related_block | safe }}
                </section>
                {% endif %}

                {{ footer_block | safe }}
            </div>
        </main>
    </div>

    <script>
        (function() {
            var btn     = document.getElementById('navToggle');
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('overlay');
            var isMobile = function() { return window.innerWidth <= 1024; };

            function toggle() {
                if (isMobile()) {
                    sidebar.classList.toggle('mobile-open');
                    overlay.classList.toggle('active');
                } else {
                    sidebar.classList.toggle('collapsed');
                }
            }
            btn.addEventListener('click', toggle);
            overlay.addEventListener('click', toggle);
        })();
    </script>
</body>
</html>
